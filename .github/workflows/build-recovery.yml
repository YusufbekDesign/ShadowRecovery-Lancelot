name: Build Shadow Recovery for Lancelot (crDroid 9 / Android 13)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Recovery Manifest Branch'
        required: true
        default: 'twrp-12.1'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    name: Build Shadow Recovery Cloud CI
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout Repository (Device Tree)
      uses: actions/checkout@v4
      with:
        path: shadow_device_tree

    - name: Clean up runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker rmi $(docker images -q) -f || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree \
          lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 lzop pngcrush rsync schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libncurses5 python3 openjdk-11-jdk curl git
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure Git
      run: |
        git config --global user.name "YusufbekDesign"
        git config --global user.email "yusufbek@shadowrecovery.local"

    - name: Initialize Recovery Manifest
      run: |
        mkdir -p /home/runner/work/recovery
        cd /home/runner/work/recovery
        BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        BRANCH="${BRANCH:-twrp-12.1}"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$BRANCH"
        repo sync -c --no-clone-bundle --no-tags -j$(nproc --all)

    - name: Copy Shadow Recovery Device Tree
      run: |
        mkdir -p /home/runner/work/recovery/device/xiaomi/lancelot
        cp -rv $GITHUB_WORKSPACE/shadow_device_tree/* /home/runner/work/recovery/device/xiaomi/lancelot/
        ls -la /home/runner/work/recovery/device/xiaomi/lancelot/

    - name: Build Shadow Recovery Image
      run: |
        cd /home/runner/work/recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch shadow_lancelot-eng || lunch twrp_lancelot-eng || lunch omni_lancelot-eng
        TARGET="${{ github.event.inputs.BUILD_TARGET }}"
        TARGET="${TARGET:-recovery}"
        mka ${TARGET}image -j$(nproc --all)

    - name: Upload Shadow Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShadowRecovery-lancelot-crDroid9-A13
        path: /home/runner/work/recovery/out/target/product/lancelot/recovery.img
        if-no-files-found: warn
